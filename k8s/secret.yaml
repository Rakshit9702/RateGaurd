# Replace CHANGE_ME before applying. In a real cluster, populate this Secret
# through a secrets manager instead of committing credentials.
apiVersion: v1
kind: Secret
metadata:
  name: rateguard-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://rateguard:CHANGE_ME@postgres:5432/rateguard
